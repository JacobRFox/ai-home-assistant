# Home assistant configuration. Values can be overridden with environment
# variables (shown in brackets) or CLI flags (`python -m home_assistant --help`).

model:
  # Any Ollama model with tool-calling support: qwen3:8b, llama3.1:8b,
  # mistral-nemo, granite3.3, ... or a custom one built from ./Modelfile.
  name: qwen3:8b                     # [HA_MODEL]
  base_url: http://localhost:11434   # [OLLAMA_HOST]
  temperature: 0.3
  num_ctx: 8192
  # Qwen3 / DeepSeek-R1 "thinking" mode. false = faster replies.
  reasoning: false

assistant:
  name: Jarvis
  # Plugins append their own notes to this prompt.
  system_prompt: |
    You are {name}, a helpful, concise home assistant running locally.
    Use tools whenever an action or live information is needed; never
    pretend you performed an action. Keep spoken-style answers short.

plugins:
  # Omit `enabled` to load every plugin found. Order sets the dashboard layout.
  enabled: [smart_home, shopping_list, notes, clock]   # [HA_PLUGINS] e.g. "clock,notes"
  disabled: []
  # Extra folders to search for plugins (each subfolder is one plugin).
  paths: [plugins]

  # Per-plugin settings: each plugin receives its own section.
  smart_home:
    # simulated     - in-memory demo devices (works out of the box)
    # homeassistant - real devices via the Home Assistant REST API
    # dirigera      - an IKEA DIRIGERA hub on your local network
    backend: simulated                       # [HA_BACKEND]
    homeassistant:
      url: http://homeassistant.local:8123   # [HASS_URL]
      token: ""                              # [HASS_TOKEN] long-lived access token
    dirigera:
      # Pair once: python -m home_assistant.builtin_plugins.smart_home.pair_dirigera <hub-ip>
      host: ""                               # [DIRIGERA_HOST] hub IP address
      token: ""                              # [DIRIGERA_TOKEN] keep it in the env, not here
      include_sensors: true                  # show temperature, door, leak and motion sensors

# Ways to talk to the assistant: python -m home_assistant [web] [telegram] [cli]
channels:
  web:
    # Dashboard + chat. There is no login, so keep it on localhost unless
    # your network is trusted.
    host: 127.0.0.1          # [HA_WEB_HOST]
    port: 8765               # [HA_WEB_PORT]
  telegram:
    # From @BotFather. Prefer the env var so the token stays out of this file.
    bot_token: ""            # [TELEGRAM_BOT_TOKEN]
    # Only these Telegram user ids may use the bot (it controls your home!).
    # Message the bot once and it will reply with your id.
    # Prefer the env var so your ids stay out of this (committed) file.
    allowed_user_ids: []     # [TELEGRAM_ALLOWED_USERS] e.g. "12345,67890"

# Each plugin stores its data in <data_dir>/<plugin_id>.json.
data_dir: data
